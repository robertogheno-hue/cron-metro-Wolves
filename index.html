<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cookies Timer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Cronômetro Cookies</title>
  <style>
    :root {
      --bg:#0f172a;
      --card:#111827;
      --card2:#1f2937;
      --text:#f8fafc;
      --muted:#cbd5e1;
      --accent:#f59e0b;
      --danger:#dc2626;
      --danger2:#7f1d1d;
      --border:#334155;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    }
    .app {
      max-width:720px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .settings {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:var(--card2);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px 14px;
    }
    .settings-title { font-weight:800; }
    .settings-sub { color:var(--muted); font-size:13px; margin-top:2px; }
    .time-edit { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .time-value { min-width:76px; text-align:center; font-weight:900; font-size:24px; }
    button {
      border:0;
      border-radius:14px;
      font-weight:900;
      font-size:20px;
      min-height:58px;
      color:var(--text);
      background:#374151;
      touch-action:manipulation;
    }
    .small-btn { width:48px; min-height:48px; font-size:28px; border:1px solid var(--border); }
    .timer-card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      padding:16px;
      text-align:center;
      transition:background .2s;
    }
    .tray { color:var(--muted); font-size:20px; font-weight:900; letter-spacing:.08em; }
    .time {
      font-size:clamp(6rem, 27vw, 11rem);
      line-height:.92;
      font-weight:1000;
      letter-spacing:-.06em;
      font-variant-numeric: tabular-nums;
      margin:8px 0;
    }
    .status { color:var(--muted); font-weight:800; font-size:18px; margin-bottom:14px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .start { background:var(--accent); color:#111827; }
    .reset { background:#374151; }
    .silence {
      display:none;
      grid-column:1 / -1;
      background:#fff;
      color:#991b1b;
      min-height:68px;
      font-size:22px;
    }
    .timer-card.alarm {
      animation: alarmFlash .42s infinite alternate;
      border-color:#fecaca;
    }
    .timer-card.alarm .tray,
    .timer-card.alarm .time,
    .timer-card.alarm .status { color:#fff; }
    .timer-card.alarm .start,
    .timer-card.alarm .reset { display:none; }
    .timer-card.alarm .silence { display:block; }
    @keyframes alarmFlash {
      from { background:var(--danger); }
      to   { background:var(--danger2); }
    }
    .footnote {
      text-align:center;
      color:var(--muted);
      font-size:12px;
      padding:2px 0 8px;
    }
    @media (max-width:380px){
      body{padding-left:10px;padding-right:10px}
      .timer-card{padding:12px}
      .time{font-size:5.7rem}
      .tray{font-size:17px}
      button{min-height:54px;font-size:18px}
      .settings{padding:10px}
      .time-value{font-size:21px;min-width:64px}
    }
    @media (prefers-reduced-motion: reduce) {
      .timer-card.alarm { animation:none; background:var(--danger); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="settings">
      <div>
        <div class="settings-title">Tempo de forno</div>
        <div class="settings-sub">Vale para as duas bandejas quando iniciadas</div>
      </div>
      <div class="time-edit">
        <button id="minus" class="small-btn" aria-label="Diminuir um minuto">−</button>
        <div id="settingValue" class="time-value">10 min</div>
        <button id="plus" class="small-btn" aria-label="Aumentar um minuto">+</button>
      </div>
    </section>

    <section class="timer-card" data-timer>
      <div class="tray">BANDEJA 1</div>
      <div class="time" aria-live="polite">10:00</div>
      <div class="status">PRONTA</div>
      <div class="actions">
        <button class="start">START</button>
        <button class="reset">RESET</button>
        <button class="silence">SILENCIAR ALARME</button>
      </div>
    </section>

    <section class="timer-card" data-timer>
      <div class="tray">BANDEJA 2</div>
      <div class="time" aria-live="polite">10:00</div>
      <div class="status">PRONTA</div>
      <div class="actions">
        <button class="start">START</button>
        <button class="reset">RESET</button>
        <button class="silence">SILENCIAR ALARME</button>
      </div>
    </section>

    <div class="footnote">Cronômetro para duas bandejas • funciona offline após a primeira abertura</div>
  </main>

<script>
(() => {
  const DEFAULT_MINUTES = 10;
  let minutes = Number(localStorage.getItem('cookie_timer_minutes')) || DEFAULT_MINUTES;
  minutes = Math.min(60, Math.max(1, Math.round(minutes)));

  const settingValue = document.getElementById('settingValue');
  const minus = document.getElementById('minus');
  const plus = document.getElementById('plus');
  const cards = [...document.querySelectorAll('[data-timer]')];
  let audioCtx = null;

  const durationMs = () => minutes * 60000;

  function format(ms) {
    const sec = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (_) {}
  }

  function beepPattern() {
    try {
      ensureAudio();
      if (!audioCtx) return;
      [780, 980, 780].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        const t = audioCtx.currentTime + i * 0.18;
        gain.gain.setValueAtTime(0.28, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.17);
      });
    } catch (_) {}
  }

  function syncIdleCards() {
    settingValue.textContent = minutes + ' min';
    localStorage.setItem('cookie_timer_minutes', minutes);
    cards.forEach(card => {
      if (!card._endAt && !card._alarming) {
        card.querySelector('.time').textContent = format(durationMs());
      }
    });
  }

  minus.addEventListener('click', () => {
    if (minutes > 1) { minutes--; syncIdleCards(); }
  });

  plus.addEventListener('click', () => {
    if (minutes < 60) { minutes++; syncIdleCards(); }
  });

  cards.forEach(card => {
    const timeEl = card.querySelector('.time');
    const statusEl = card.querySelector('.status');
    const startBtn = card.querySelector('.start');
    const resetBtn = card.querySelector('.reset');
    const silenceBtn = card.querySelector('.silence');

    card._endAt = null;
    card._ticker = null;
    card._alarmTicker = null;
    card._alarming = false;

    function clearLoops() {
      if (card._ticker) clearInterval(card._ticker);
      if (card._alarmTicker) clearInterval(card._alarmTicker);
      card._ticker = null;
      card._alarmTicker = null;
    }

    function finish() {
      clearLoops();
      card._endAt = null;
      card._alarming = true;
      timeEl.textContent = '00:00';
      statusEl.textContent = 'RETIRAR DO FORNO!';
      card.classList.add('alarm');
      beepPattern();
      card._alarmTicker = setInterval(beepPattern, 850);
      if (navigator.vibrate) navigator.vibrate([500,250,500,250,1000]);
    }

    function update() {
      if (!card._endAt) return;
      const left = card._endAt - Date.now();
      if (left <= 0) finish();
      else timeEl.textContent = format(left);
    }

    startBtn.addEventListener('click', () => {
      ensureAudio();
      if (card._endAt || card._alarming) return;
      card._endAt = Date.now() + durationMs();
      statusEl.textContent = 'ASSANDO…';
      startBtn.textContent = 'ASSANDO';
      update();
      card._ticker = setInterval(update, 200);
    });

    resetBtn.addEventListener('click', () => {
      clearLoops();
      card._endAt = null;
      card._alarming = false;
      card.classList.remove('alarm');
      timeEl.textContent = format(durationMs());
      statusEl.textContent = 'PRONTA';
      startBtn.textContent = 'START';
    });

    silenceBtn.addEventListener('click', () => {
      clearLoops();
      card._endAt = null;
      card._alarming = false;
      card.classList.remove('alarm');
      timeEl.textContent = format(durationMs());
      statusEl.textContent = 'PRONTA';
      startBtn.textContent = 'START';
      if (navigator.vibrate) navigator.vibrate(0);
    });
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      cards.forEach(card => {
        if (card._endAt) {
          const left = card._endAt - Date.now();
          if (left <= 0 && !card._alarming) {
            const silence = card.querySelector('.silence');
            card.querySelector('.time').textContent = '00:00';
            card.querySelector('.status').textContent = 'RETIRAR DO FORNO!';
            card.classList.add('alarm');
            card._alarming = true;
            card._endAt = null;
            beepPattern();
            card._alarmTicker = setInterval(beepPattern, 850);
          }
        }
      });
    }
  });

  syncIdleCards();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
